name: Bug 报告
description: 提交一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现信息。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果
      placeholder: 我执行了 …，期望 …，实际 …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.12 / 版本号
    validations:
      required: false
